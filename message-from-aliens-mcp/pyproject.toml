[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "message-from-aliens-mcp"
version = "0.1.10"
description = "MCP server for reading, clicking, annotating, and inspecting glyphs in Message From Aliens"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "game", "reverse-engineering", "windows"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
]
dependencies = [
    "mcp>=1.30,<3", "frida>=17.26.2,<18", "pillow>=10,<14",
    "windows-capture>=2.0.1,<3; sys_platform == 'win32'",
]

[project.scripts]
message-from-aliens-mcp = "aliens_mcp.__main__:main"
aliens-mcp = "aliens_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aliens_mcp"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/scripts", "/README.md", "/README.zh-CN.md", "/LICENSE", "/pyproject.toml"]
